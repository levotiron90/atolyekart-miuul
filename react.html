      --text: #f2e9de;
      --muted: #b7a795;
      --accent: #9db28e;

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

function slugify(text) {
  const trMap = { ç: "c", ğ: "g", ı: "i", ö: "o", ş: "s", ü: "u", İ: "i" };
  return text
    .split("")
    .map((ch) => trMap[ch] || ch)
    .join("")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function getProductId(productName, variantName) {
  return `${slugify(productName)}_${slugify(variantName)}`;
}

const emailRegex = /^(?=.*@)(?=.*\.com).+$/i;

const COUNTRY_CODES = [
  { flag: "🇹🇷", code: "+90", label: "Türkiye" },
  { flag: "🇺🇸", code: "+1", label: "ABD" },
  { flag: "🇩🇪", code: "+49", label: "Almanya" },
  { flag: "🇬🇧", code: "+44", label: "İngiltere" },
];

async function fetchAuthToken() {
  const res = await fetch("/api/token");
  if (!res.ok) {
    throw new Error(`Token alınamadı: ${res.status}`);
  }
  const data = await res.json();
  try {
    localStorage.setItem("atolyekart_jwt", data.token);
  } catch (err) {
    console.warn("localStorage'a token yazılamadı:", err);
  }
  return data.token;
}

async function sendToWebhook(payload) {
  // Gerçek webhook adresi tarayıcıya hiç gönderilmez: istek aynı origin'deki
  // /api/webhook serverless fonksiyonuna gider, o da process.env.WEBHOOK_URL'i
  // sunucu tarafında okuyup hedefe iletir. Aynı origin olduğu için CORS sorunu
  // yaşanmaz, normal application/json isteği yeterlidir.
  // /api/webhook ayrıca Authorization: Bearer <JWT> header'ını zorunlu kılar
  // (anonim, oturum bazlı token — bkz. fetchAuthToken). Token süresi dolmuşsa
  // (401) yeni bir token alınıp istek bir kez daha denenir.
  // Dönüş değeri true/false: çağıran bileşen (OrderForm/StockNotifyForm) buna
  // göre kullanıcıya başarı ya da hata mesajı gösterir — istek gerçekten
  // teslim edilmediyse (ör. 429, ağ hatası) artık sessizce "başarılı" denmez.
  let success = false;
  try {
    let token = null;
    try {
      token = localStorage.getItem("atolyekart_jwt");
    } catch (err) {
      console.warn("localStorage okunamadı:", err);
    }
    let response = await fetch("/api/webhook", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token || ""}`,
      },
      body: JSON.stringify(payload),
    });

    if (response.status === 401) {
      token = await fetchAuthToken();
      response = await fetch("/api/webhook", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(payload),
      });
    }

    if (!response.ok) {
      console.warn("Webhook isteği başarısız:", response.status);
    } else {
      success = true;
    }
  } catch (err) {
    console.warn("Webhook'a ulaşılamadı:", err);
  }
  console.log("Webhook payload:", payload);
  return success;
}

const TRUST_ITEMS = [
  { label: "El Yapımı, Küçük Seri Üretim", icon: "hand" },
  { label: "Doğal ve Bitkisel İçerik", icon: "leaf" },
  { label: "Plastiksiz, Sürdürülebilir Ambalaj", icon: "drop" },
];

function TrustIcon({ type }) {
  if (type === "leaf") {
    return (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 20c8 0 14-6 14-16-10 0-16 6-14 16z" />
        <path d="M4 20c2-6 6-10 12-13" />
      </svg>
    );
  }
  if (type === "drop") {
    return (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3c4 5 7 8.5 7 12a7 7 0 0 1-14 0c0-3.5 3-7 7-12z" />
      </svg>
    );
  }
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M7 11V6a2 2 0 1 1 4 0v5" />
      <path d="M11 10.5V4a2 2 0 1 1 4 0v7" />
      <path d="M15 10.5V6a2 2 0 1 1 4 0v8c0 4-3 7-7 7s-6-2-7.5-4.5L3 13a1.7 1.7 0 0 1 2.5-2.3L7 12.5" />
    </svg>
  );
}

function ProductImage({ imageUrl, alt }) {

      alt={alt}
      loading="lazy"

function OrderForm({ product, variant, onSubmitted }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [countryCode, setCountryCode] = useState(COUNTRY_CODES[0].code);
  const [phone, setPhone] = useState("");
  const [quantity, setQuantity] = useState(1);
  const [consent, setConsent] = useState(false);
  const [sending, setSending] = useState(false);

  const unitPrice = Number(variant.price.replace(/\D/g, "")) || 0;
  const totalPrice = unitPrice * (Number(quantity) || 0);

  const handleSubmit = async (e) => {
    e.preventDefault();
    // Çift gönderim koruması: setSending(true) sonrası buton disabled olur,
    // ama React'in state güncellemesi bir sonraki render'a kadar DOM'a
    // yansımayabilir (ör. Enter'a art arda basma). Bu senkron kontrol,
    // aynı tık/tuş turunda ikinci bir gönderimi anında engeller.
    if (sending) return;
    if (!emailRegex.test(email)) {
      alert("Lütfen geçerli bir e-posta adresi girin (örn. ad@ornek.com).");
      return;
    }
    if (!consent) {
      alert("Devam etmek için KVKK Aydınlatma Metni'ni kabul etmeniz gerekiyor.");
      return;
    }
    setSending(true);
    const success = await sendToWebhook({
      event: "order.created",
      name,
      productId: getProductId(product.name, variant.name),
      productName: `${product.name} — ${variant.name}`,
      phone: `${countryCode} ${phone}`,
      email,
      quantity: Number(quantity),
      source: "atolyekart-web",
      kvkkConsent: consent,
      consentAt: new Date().toISOString(),
      policyVersion: "2026-08-02",
    });
    setSending(false);
    onSubmitted(success);
  };

  return (
    <form className="inline-form" onSubmit={handleSubmit}>
      <label className="form-field">
        <span>Ad Soyad</span>
        <input type="text" required maxLength={200} value={name} onChange={(e) => setName(e.target.value)} />
      </label>
      <label className="form-field">
        <span>E-posta</span>
        <input type="email" required maxLength={200} value={email} onChange={(e) => setEmail(e.target.value)} />
      </label>
      <label className="form-field">
        <span>Telefon</span>
        <div className="phone-field">
          <select
            className="country-code-select"
            value={countryCode}
            onChange={(e) => setCountryCode(e.target.value)}
          >
            {COUNTRY_CODES.map((c) => (
              <option key={c.code} value={c.code}>
                {c.flag} {c.code}
              </option>
            ))}
          </select>
          <input type="tel" required maxLength={30} value={phone} onChange={(e) => setPhone(e.target.value)} />
        </div>
      </label>
      <label className="form-field form-field-quantity">
        <span>Adet</span>
        <input type="number" min="1" max="100" required value={quantity} onChange={(e) => setQuantity(e.target.value)} />
      </label>
      <div className="order-total">
        <span>Toplam Tutar</span>
        <strong>₺{totalPrice}</strong>
      </div>
      <label className="consent-field">
        <input
          type="checkbox"
          required
          checked={consent}
          onChange={(e) => setConsent(e.target.checked)}
        />
        <span>
          Kişisel verilerimin siparişimin oluşturulması ve tarafımla iletişime
          geçilmesi amacıyla işlenmesini{" "}
          <a href="gizlilik-politikasi.html" target="_blank" rel="noopener noreferrer">
            KVKK Aydınlatma Metni
          </a>{" "}
          kapsamında kabul ediyorum.
        </span>
      </label>
      <button className="form-submit" type="submit" disabled={sending || !consent}>
        {sending ? "Gönderiliyor…" : "Siparişi Onayla"}
      </button>
    </form>
  );
}

function ProductCard({ product }) {
  const [variantIndex, setVariantIndex] = useState(0);
  const [actionOpen, setActionOpen] = useState(false);
  const [submitStatus, setSubmitStatus] = useState(null); // null | "success" | "error"
  const variant = product.variants[variantIndex];
  const productId = getProductId(product.name, variant.name);
  const inStock = STOCK[productId] !== false;

  useEffect(() => {
    setActionOpen(false);
    setSubmitStatus(null);
  }, [variantIndex]);

  return (
    <div className="card">
      <div className="card-image-wrap">
        <ProductImage imageUrl={product.imageUrl} alt={product.alt} />
        <div className="price-badge">
          <span>{variant.price}</span>
          <span className="price-note">{variant.priceNote}</span>
        </div>
        {!inStock && <div className="stock-badge">Tükendi</div>}
      </div>
      <div className="card-body">
        <h3>{product.name}</h3>
        <select
          className="variant-select"
          value={variantIndex}
          onChange={(e) => setVariantIndex(Number(e.target.value))}
          aria-label={`${product.name} çeşidi seç`}
          title={`${variant.name} — ${variant.subtitle}`}
        >
          {product.variants.map((v, index) => (
            <option value={index} key={v.name}>
              {v.name} — {v.subtitle}
            </option>
          ))}
        </select>
        <div className="tag-row">
          {variant.tags.map((tag) => (
            <span className="tag" key={tag}>{tag}</span>
          ))}
        </div>
        <p className="description">{variant.description}</p>

        {submitStatus === "success" ? (
          <p className="form-success">
            {inStock
              ? "Siparişiniz alındı, teşekkürler! En kısa sürede sizinle iletişime geçeceğiz."
              : "Talebiniz alındı — ürün stoğa girdiğinde size haber vereceğiz."}
          </p>
        ) : submitStatus === "error" ? (
          <p className="form-error">
            Şu anda yoğunluk var, isteğiniz iletilemedi. Lütfen bir dakika sonra tekrar deneyin.
          </p>
        ) : actionOpen ? (
          inStock ? (
            <OrderForm product={product} variant={variant} onSubmitted={(success) => setSubmitStatus(success ? "success" : "error")} />
          ) : (
            <StockNotifyForm product={product} variant={variant} onSubmitted={(success) => setSubmitStatus(success ? "success" : "error")} />
          )
        ) : (
          <button
            className={inStock ? "action-button" : "action-button action-button-secondary"}
            onClick={() => setActionOpen(true)}
          >
            {inStock ? "Sipariş Ver" : "Stok Bildirimi İste"}
          </button>
        )}
      </div>
    </div>
  );
}

function getChatSessionId() {
  let id = null;
  try {
    id = localStorage.getItem("atolyekart_chat_session");
  } catch (err) {
    console.warn("localStorage okunamadı:", err);
  }
  if (!id) {
    id = `web-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    try {
      localStorage.setItem("atolyekart_chat_session", id);
    } catch (err) {
      console.warn("localStorage'a yazılamadı:", err);
    }
  }
  return id;
}

async function sendChatMessage(sessionId, chatInput) {
  // Gerçek n8n chat webhook adresi tarayıcıya hiç gönderilmez: istek aynı
  // origin'deki /api/chat serverless fonksiyonuna gider, o da
  // process.env.CHAT_WEBHOOK_URL'i sunucu tarafında okuyup n8n'e iletir.
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId, chatInput }),
  });
  if (!response.ok) {
    throw new Error(`Sohbet isteği başarısız: ${response.status}`);
  }
  const data = await response.json();
  return data.output;
}

function ChatWidget() {
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([
    {
      role: "bot",
      text: "Merhaba! Ben AtölyeKart asistanıyım. Ürünlerimiz hakkında sorularını yanıtlamaktan memnuniyet duyarım.",
    },
  ]);
  const [input, setInput] = React.useState("");
  const [sending, setSending] = React.useState(false);
  const sessionIdRef = React.useRef(null);
  const messagesEndRef = React.useRef(null);

  if (!sessionIdRef.current) {
    sessionIdRef.current = getChatSessionId();
  }

  React.useEffect(() => {
    if (messagesEndRef.current) {
      messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  }, [messages, sending]);

  async function handleSend(e) {
    e.preventDefault();
    const text = input.trim();
    if (!text || sending) return;
    setMessages((prev) => [...prev, { role: "user", text }]);
    setInput("");
    setSending(true);
    try {
      const output = await sendChatMessage(sessionIdRef.current, text);
      setMessages((prev) => [...prev, { role: "bot", text: output }]);
    } catch (err) {
      console.warn("Sohbet mesajı gönderilemedi:", err);
      setMessages((prev) => [
        ...prev,
        { role: "error", text: "Üzgünüm, şu anda cevap veremiyorum. Lütfen daha sonra tekrar deneyin." },
      ]);
    } finally {
      setSending(false);
    }
  }

  return (
    <React.Fragment>
      {open && (
        <div className="chat-panel" role="dialog" aria-label="AtölyeKart sohbet asistanı">
          <div className="chat-panel-header">
            <div>
              <strong>AtölyeKart Asistanı</strong>
              <span>Ürünler hakkında soru sorabilirsin</span>
            </div>
            <button
              type="button"
              className="chat-close-btn"
              onClick={() => setOpen(false)}
              aria-label="Sohbeti kapat"
            >
              ✕
            </button>
          </div>
          <div className="chat-messages">
            {messages.map((msg, i) => (
              <div key={i} className={`chat-msg ${msg.role}`}>
                {msg.text}
              </div>
            ))}
            {sending && (
              <div className="chat-typing">
                <span></span>
                <span></span>
                <span></span>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>
          <form className="chat-input-row" onSubmit={handleSend}>
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Bir soru yaz..."
              disabled={sending}
            />
            <button type="submit" className="chat-send-btn" disabled={sending || !input.trim()} aria-label="Gönder">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 2 11 13" />
                <path d="M22 2 15 22l-4-9-9-4 20-7z" />
              </svg>
            </button>
          </form>
        </div>
      )}
      <button
        type="button"
        className="chat-fab"
        onClick={() => setOpen((v) => !v)}
        aria-label={open ? "Sohbeti kapat" : "Sohbeti aç"}
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
        </svg>
      </button>
    </React.Fragment>
  );
}
